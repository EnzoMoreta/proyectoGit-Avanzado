name: CD Prod

on: [push]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          echo "AppVersion-1" >> README.md
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git commit -am "bump version"
          git pull origin main --rebase || true
          git push origin main

  validar:
    needs: version
    runs-on: self-hosted
    steps:
      - name: Comprobar token prod
        env:
          TOKEN_GITHUB: ${{ secrets.PROD_TOKEN }}
        shell: powershell
        run: |
          $tokenLocal = [System.Environment]::GetEnvironmentVariable("LOCAL_PROD_TOKEN", "Machine")
          if ("$env:TOKEN_GITHUB" -eq "$tokenLocal") {
              Write-Host "Tokens correctos"
          } else {
              Write-Host "Error en tokens"
              exit 1
          }