validate-dev:
    runs-on: self-hosted
    steps:
      - name: Comprobar token dev
        env:
          TOKEN_GITHUB: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          $tokenLocal = [System.Environment]::GetEnvironmentVariable("LOCAL_DEV_TOKEN", "User")
          if ("$env:TOKEN_GITHUB" -eq "$tokenLocal") {
              Write-Host "Tokens correctos"
          } else {
              Write-Host "Error en tokens"
              exit 1
          }